name: Записать результат

# Игра создаёт issue «run: …» с результатом — этот workflow переносит его в data/results.json.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: results            # результаты пишутся строго по одному, без конфликтов
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, 'run:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Добавить результат
        env:                   # данные issue — только через переменные окружения (защита от подстановки кода)
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          STATUS_FILE: ${{ runner.temp }}/status.txt
        run: python3 scripts/add_result.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "gerald-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Новый результат"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Закрыть issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_FILE: ${{ runner.temp }}/status.txt
          NUMBER: ${{ github.event.issue.number }}
        run: |
          MSG="$(sed -n '2p' "$STATUS_FILE" 2>/dev/null || true)"
          [ -z "$MSG" ] && MSG="Не получилось записать результат, смотри лог Actions."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MSG"
